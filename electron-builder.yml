appId: com.nexdb.app
productName: NexDB
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - build/icon.png
  - build/icon.ico
  - "!src/**/*"
  - "!docs/**/*"
  - "!scripts/**/*"
  - "!electron.vite.config.mts"
  - "!tsconfig*.json"
  - "!vitest.config.ts"
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - build/icon.png
  - build/icon.ico
npmRebuild: false
mac:
  icon: build/icon.icns
  target: [dmg, zip]
  category: public.app-category.developer-tools
  identity: null
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
linux:
  icon: build/icon.png
  target: [AppImage, deb]
  category: Development
