appId: com.nexdb.app
productName: NexDB
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - build/icon.png
  - "!src/**/*"
  - "!docs/**/*"
  - "!scripts/**/*"
  - "!electron.vite.config.mts"
  - "!tsconfig*.json"
  - "!vitest.config.ts"
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - build/icon.png
npmRebuild: true
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  identity: null
win:
  target: [nsis]
linux:
  target: [AppImage, deb]
  category: Development
