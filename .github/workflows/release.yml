name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: macos-latest
            targets: --mac --x64 --arm64
          - os: windows-latest
            targets: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # Uses the pnpm version from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package with bundled MongoDB tools
        run: pnpm exec electron-builder ${{ matrix.targets }} --publish never
      - name: Package Lite (without bundled tools)
        run: pnpm exec electron-builder ${{ matrix.targets }} --config electron-builder.lite.cjs --publish never
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          fail_on_unmatched_files: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
